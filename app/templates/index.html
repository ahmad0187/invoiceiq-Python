<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InvoiceIQ: invoice data extraction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">IQ</span>InvoiceIQ</div>
  <span class="pill" title="Which extractor is active">{{ 'Claude extraction' if extractor == 'claude' else 'Rule-based extraction (offline)' }}</span>
  <div class="grow"></div>
  <a class="btn" href="/api/export?format=csv">Export CSV</a>
  <a class="btn dark" href="/api/export?format=xlsx">Export Excel</a>
</header>

<main class="wrap">
  <section class="kpis" id="kpis"></section>

  <label class="drop" id="drop">
    <input type="file" id="file" accept="application/pdf,.pdf" multiple hidden>
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>
    <div><strong>Drop invoice PDFs here</strong> or click to browse<br><span>Up to 20 files at once. Data is extracted, checked and ready to export in seconds.</span></div>
  </label>
  <div class="toast" id="toast" hidden></div>

  <section class="card">
    <div class="tools">
      <div class="tabs" id="tabs">
        <button data-status="" class="on">All</button>
        <button data-status="needs_review">Needs review</button>
        <button data-status="ready">Ready</button>
        <button data-status="approved">Approved</button>
      </div>
      <input id="search" type="search" placeholder="Search vendor or invoice number">
    </div>
    <table class="grid">
      <thead><tr><th>Vendor</th><th>Invoice #</th><th>Date</th><th>Due</th><th class="num">Total</th><th>Status</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" hidden>No invoices yet. Upload a PDF, or try the samples in <code>samples/</code>.</div>
  </section>
</main>

<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <div><div class="muted" id="d-file"></div><h2 id="d-title">Invoice</h2></div>
    <button class="icon" id="d-close" aria-label="Close">×</button>
  </div>
  <div class="drawer-body">
    <div id="d-issues"></div>
    <form id="d-form" class="fields"></form>
    <h3>Line items</h3>
    <table class="grid small"><thead><tr><th>Description</th><th class="num">Qty</th><th class="num">Unit</th><th class="num">Amount</th></tr></thead><tbody id="d-items"></tbody></table>
  </div>
  <div class="drawer-foot">
    <button class="btn danger" id="d-delete">Delete</button>
    <a class="btn" id="d-pdf" target="_blank" rel="noopener">Open PDF</a>
    <div class="grow"></div>
    <button class="btn" id="d-save">Save changes</button>
    <button class="btn dark" id="d-approve">Approve</button>
  </div>
</aside>
<div class="scrim" id="scrim" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
