[project]
name = "invoiceiq"
version = "1.0.0"
description = "Extract, validate and export invoice data from PDFs (FastAPI + Claude, with an offline rule-based extractor)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ahmad Murtaza" }]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E702", "B008"]  # semicolons in the sample generator; FastAPI's Depends() defaults

[tool.ruff.lint.per-file-ignores]
"samples/*" = ["E501"]
"app/models.py" = ["UP006", "UP045"]  # SQLModel relationships need typing.List/Optional at runtime

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
